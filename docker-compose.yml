services:
  runner-health-agent:
    build: .
    image: runner-health-agent:latest
    container_name: runner-health-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Pinned to the mounted volume regardless of DATABASE_URL in .env, so
      # data survives container recreation (not just restarts).
      - DATABASE_URL=sqlite:////app/data/runner_health.db
    extra_hosts:
      # host.docker.internal works out of the box on Docker Desktop
      # (Windows/Mac); this makes it resolve on Linux hosts too, for reaching
      # a model server (e.g. Ollama) running on the host machine.
      - "host.docker.internal:host-gateway"
    volumes:
      - runner_health_data:/app/data

volumes:
  runner_health_data:
